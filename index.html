<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قناة عربي | الصفحة الرسمية</title>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #121417;
            --card-bg: rgba(28, 32, 38, 0.85);
            --card-hover-bg: rgba(38, 44, 52, 0.95);
            --text-main: #ffffff;
            --text-sub: #b0b8c1;
            --border-color: rgba(255, 255, 255, 0.12);
            --accent-color: #FF0000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            text-align: center;
            background: var(--card-bg);
            padding: 35px 25px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        /* تصميم صورة البروفايل */
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-color);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
            margin-bottom: 15px;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        p.bio {
            color: var(--text-sub);
            font-size: 15px;
            margin-bottom: 25px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--card-hover-bg);
            color: var(--text-main);
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-weight: 700;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .link-btn:hover {
            transform: translateY(-3px);
            border-color: var(--accent-color);
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.2);
        }

        .link-btn i {
            font-size: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- هنا مكان اسم ملف الصورة التي رفعتها -->
        <img src="profile.jpg" alt="قناة عربي" class="profile-img">

        <h1>قناة عربي</h1>
        <p class="bio">مرحباً بكم في الصفحة الرسمية للقناة</p>

        <div class="links">
            <a href="https://youtube.com" target="_blank" class="link-btn">
                <i class="fab fa-youtube" style="color: #FF0000;"></i>
                قناة اليوتيوب
            </a>
        </div>
    </div>

</body>
</html>
