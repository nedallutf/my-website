            background-position: center;
            background-repeat: no-repeat;
            background-size: contain;
            opacity: 0.13;
            pointer-events: none;
            z-index: 1;
            filter: grayscale(20%);
        }

        /* Radial overlay to keep text ultra crisp */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(18, 20, 23, 0.4) 0%, rgba(12, 14, 16, 0.92) 100%);
            pointer-events: none;
            z-index: 2;
        }

        /* Container */
        .container {
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 430px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Header */
        .header {
            margin-bottom: 28px;
            width: 100%;
        }

        .logo-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 16px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #424952, #181b20);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 15px rgba(255, 255, 255, 0.05);
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }

        .channel-title {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .channel-desc {
            font-size: 16px;
            color: var(--text-sub);
            font-weight: 500;
            background: rgba(255, 255, 255, 0.06);
            display: inline-block;
            padding: 6px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
        }

        /* App Boxes - Vertical Order */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 16px 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-main);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 4px;
            height: 100%;
            transition: width 0.3s ease;
        }

        .link-card.youtube::before { background: var(--youtube-color); }
        .link-card.instagram::before { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .link-card.tiktok::before { background: linear-gradient(45deg, #00f2fe, #fe0979); }

        .icon-box {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-left: 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .youtube .icon-box { color: #ff4d4d; }
        .instagram .icon-box { color: #ff6699; }
        .tiktok .icon-box { color: #00f2fe; }

        .link-text {
            font-size: 18px;
            font-weight: 700;
            flex-grow: 1;
            text-align: right;
        }

        .arrow-icon {
            font-size: 14px;
            color: var(--text-sub);
            opacity: 0.6;
            transition: transform 0.3s ease, opacity 0.3s ease;
            margin-right: 4px;
        }

        /* Hover & Touch Animation */
        .link-card:hover {
            transform: translateY(-3px);
            background: var(--card-hover-bg);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.5);
        }

        .link-card:hover .icon-box {
            transform: scale(1.1) rotate(-5deg);
            background: rgba(255, 255, 255, 0.12);
        }

        .link-card:hover .arrow-icon {
            opacity: 1;
            transform: translateX(-5px);
            color: var(--text-main);
        }

        /* Future Expansion Section */
        .future-video-section {
            margin-top: 25px;
            width: 100%;
        }

        /* Footer */
        .footer {
            margin-top: 35px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.35);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .logo-wrapper {
                width: 105px;
                height: 105px;
            }
            .channel-title {
                font-size: 25px;
            }
            .link-card {
                padding: 15px 18px;
            }
            .link-text {
                font-size: 16.5px;
            }
        }
    </style>
</head>
